version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same 3-day delay as minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 3

  # Bumps the pinned image versions and digests in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
